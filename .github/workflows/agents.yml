name: Job agents (hourly)

on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07 (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:
    inputs:
      job:
        description: "Reprocess one job id (optional, e.g. JF-20260927-ABCDE)"
        required: false
      all_sources:
        description: "Ignore per-source throttles"
        type: boolean
        default: true

concurrency:
  group: job-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Install LibreOffice (for PDF export)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer fonts-liberation fonts-crosextra-carlito > /dev/null
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FAST_MODEL: ${{ vars.GEMINI_FAST_MODEL }}
          LLM_MAX_CALLS_PER_RUN: ${{ vars.LLM_MAX_CALLS_PER_RUN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          ARGS="--trigger ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'schedule' }}"
          if [ -n "${{ inputs.job }}" ]; then ARGS="$ARGS --job ${{ inputs.job }}"; fi
          if [ "${{ inputs.all_sources }}" = "true" ]; then ARGS="$ARGS --all-sources"; fi
          python -m jobfinder.pipeline $ARGS
