name: Job agents (hourly)

on:
  # Hourly runs come from the Cloudflare worker in scheduler/ because GitHub's cron runs late a lot.
  # This is just a backup; the pipeline skips it if a scheduled run already happened.
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Run type (the scheduler sends 'schedule', which keeps per-source throttles)"
        type: choice
        options: [manual, schedule]
        default: manual
      job:
        description: "Reprocess one job id (optional, e.g. JF-20260927-ABCDE)"
        required: false
      compare:
        description: "Model comparison id (started from the app)"
        required: false
      all_sources:
        description: "Ignore per-source throttles"
        type: boolean
        default: true

concurrency:
  group: job-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Install LibreOffice (for PDF export)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer fonts-liberation fonts-crosextra-carlito > /dev/null
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # owner's keys (single or comma-separated lists)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_KEYS: ${{ secrets.ADZUNA_KEYS }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FAST_MODEL: ${{ vars.GEMINI_FAST_MODEL }}
        run: |
          ARGS="--trigger ${{ inputs.trigger || (github.event_name == 'workflow_dispatch' && 'manual' || 'schedule') }}"
          if [ -n "${{ inputs.job }}" ]; then ARGS="$ARGS --job ${{ inputs.job }}"; fi
          if [ -n "${{ inputs.compare }}" ]; then ARGS="$ARGS --compare ${{ inputs.compare }}"; fi
          if [ "${{ inputs.all_sources }}" = "true" ]; then ARGS="$ARGS --all-sources"; fi
          python -m jobfinder.pipeline $ARGS
