name: Build Android app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write   # publish the APK to the "android" release

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every APK must be signed with the same key, otherwise installed apps can't be updated.
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets before building the APK"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build signed APK
        working-directory: app
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GITHUB_REPO=${{ github.repository }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/pounce.apk"
          rm "$RUNNER_TEMP/upload-keystore.jks"

      - name: Check the signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/pounce.apk" | tee /tmp/certs.txt
          grep -q "CN=Raj Kumar G K" /tmp/certs.txt || { echo "::error::APK isn't signed with the Pounce upload key"; exit 1; }

      - name: Publish to the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          NOTES="Pounce for Android $VERSION (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}).

          Install: open this page on your Android phone, download pounce.apk, open it and allow installs from your browser when asked. To update, download it again and install over the old version."
          if gh release view android > /dev/null 2>&1; then
            gh release upload android "$RUNNER_TEMP/pounce.apk" --clobber
            gh release edit android --title "Pounce for Android" --notes "$NOTES"
          else
            gh release create android "$RUNNER_TEMP/pounce.apk" --target "$GITHUB_SHA" --title "Pounce for Android" --notes "$NOTES" --latest
          fi
          echo "::notice::Pounce $VERSION build ${{ github.run_number }}: https://github.com/${{ github.repository }}/releases/download/android/pounce.apk"
