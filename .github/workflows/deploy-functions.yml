name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a SUPABASE_ACCESS_TOKEN secret (Supabase dashboard > Account > Access Tokens)"
            exit 1
          fi
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          if [ -z "$REF" ] || [ "$REF" = "$SUPABASE_URL" ]; then
            echo "::error::Couldn't read the project ref from SUPABASE_URL"
            exit 1
          fi
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Test
        run: deno test --no-lock supabase/functions/tests/

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1   # pinned: CLI 3.x came out on 2026-11-02, untested here
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # each function checks the user itself (needed with the new API keys)
        run: |
          for fn in resume-ai account; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
