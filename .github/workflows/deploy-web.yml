name: Deploy web app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      # check the Cloudflare secrets first so the error is readable
      - name: Check Cloudflare credentials
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ]   || { echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty"; exit 1; }
          if ! [[ "$CF_ACCOUNT" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 lowercase hex characters; got ${#CF_ACCOUNT} characters (check for spaces or a copied URL)"
          fi
          auth=(-H "Authorization: Bearer $CF_TOKEN")
          user=$(curl -s "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')
          acct=$(curl -s "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')
          pages=$(curl -s "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -c '{success, errors: [.errors[]? | "\(.code) \(.message)"], projects: [.result[]?.name]}')
          echo "::notice::Cloudflare token (user) $user | token (account) $acct | Pages access $pages"
          echo "$pages" | jq -e '.success' > /dev/null || { echo "::error::Token cannot access Cloudflare Pages on this account: $pages"; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: Publish to Cloudflare Pages
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # fails with "already exists" after the first run, that's fine
          npx --yes wrangler@4 pages project create jobfinder --production-branch=main 2>&1 | tail -3 || true
          if ! npx --yes wrangler@4 pages deploy app/build/web --project-name=jobfinder --branch=main --commit-dirty=true 2>&1 | tee /tmp/deploy.log; then
            echo "::error::Wrangler: $(grep -iE 'error|✘|failed' /tmp/deploy.log | tail -6 | tr '\n' ' ')"
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)
          echo "::notice::Deployed to $url"
