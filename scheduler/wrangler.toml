# Starts the agents workflow every hour (GitHub's own cron runs late too often).
# Deployed by .github/workflows/deploy-scheduler.yml.
name = "jobfinder-scheduler"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["7 * * * *"]  # :07 UTC

[vars]
WORKFLOW = "agents.yml"
BRANCH = "main"

[observability]
enabled = true
